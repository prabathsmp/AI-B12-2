version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persists your FAISS database on your host machine so you don't lose indexed PDFs
      - ./backend/faiss_storage:/app/faiss_storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      # In Docker, services communicate using service names instead of localhost
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped