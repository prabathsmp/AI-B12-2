version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crew_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - crew_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crew_frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - crew_net

networks:
  crew_net:
    driver: bridge